        #forward { left: 50%; transform: translateX(-50%); bottom: 100px; }
        #back    { left: 50%; transform: translateX(-50%); bottom: 25px; }

    <script>
        // ====================== 🌸🌸🌸 EDIT YOUR 10 JPEG LINKS HERE 🌸🌸🌸 ======================
        const pictureUrls = [
            "https://raw.githubusercontent.com/DJPetraDJP/BEACH-GALLERY/main/20260519_142122.jpg",     // 1
            "https://raw.githubusercontent.com/DJPetraDJP/BEACH-GALLERY/main/20260519_142340.jpg",     // 2
            "https://raw.githubusercontent.com/DJPetraDJP/BEACH-GALLERY/main/20260519_143604.jpg",     // 3
            "https://raw.githubusercontent.com/DJPetraDJP/BEACH-GALLERY/main/20260520_092404.jpg",     // 4
            "https://raw.githubusercontent.com/DJPetraDJP/BEACH-GALLERY/main/20260520_092419.jpg",     // 5
            "https://raw.githubusercontent.com/DJPetraDJP/BEACH-GALLERY/main/20260520_092601.jpg",     // 6
            "https://raw.githubusercontent.com/DJPetraDJP/BEACH-GALLERY/main/grok_image_1779265341644.jpg",  // 7
            "https://raw.githubusercontent.com/DJPetraDJP/BEACH-GALLERY/main/grok_image_1779265352583.jpg",  // 8
            "https://raw.githubusercontent.com/DJPetraDJP/BEACH-GALLERY/main/grok_image_1779265378523.jpg",  // 9
            "https://raw.githubusercontent.com/DJPetraDJP/BEACH-GALLERY/main/grok_image_1779265398351.jpg"   // 10
        ];

        // ====================== 🎵🎵🎵 EDIT YOUR MP3 MUSIC LINK HERE 🎵🎵🎵 ======================
        const musicUrl = "https://example.com/your-music.mp3";   // ← Replace with your MP3 link (raw GitHub URL after upload)

        // Apply JPEGs
        for (let i = 1; i <= 10; i++) {
            const screen = document.getElementById('screen' + i);
            if (screen) screen.setAttribute('material', 'src', pictureUrls[i-1]);
        }

        // ====================== MOVEMENT AND ROBOTS (DO NOT CHANGE) ======================
        const camera = document.getElementById('cam');
        let moveForward = 0, moveSide = 0;

        // Arrow controls
        document.getElementById('forward').addEventListener('touchstart', () => moveForward = 0.16);
        document.getElementById('forward').addEventListener('touchend', () => moveForward = 0);
        document.getElementById('forward').addEventListener('mousedown', () => moveForward = 0.16);
        document.getElementById('forward').addEventListener('mouseup', () => moveForward = 0);

        document.getElementById('back').addEventListener('touchstart', () => moveForward = -0.11);
        document.getElementById('back').addEventListener('touchend', () => moveForward = 0);
        document.getElementById('back').addEventListener('mousedown', () => moveForward = -0.11);
        document.getElementById('back').addEventListener('mouseup', () => moveForward = 0);

        document.getElementById('left').addEventListener('touchstart', () => moveSide = -0.13);
        document.getElementById('left').addEventListener('touchend', () => moveSide = 0);
        document.getElementById('left').addEventListener('mousedown', () => moveSide = -0.13);
        document.getElementById('left').addEventListener('mouseup', () => moveSide = 0);

        document.getElementById('right').addEventListener('touchstart', () => moveSide = 0.13);
        document.getElementById('right').addEventListener('touchend', () => moveSide = 0);
        document.getElementById('right').addEventListener('mousedown', () => moveSide = 0.13);
        document.getElementById('right').addEventListener('mouseup', () => moveSide = 0);

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') moveForward = 0.16;
            if (e.key === 'ArrowDown' || e.key === 's') moveForward = -0.11;
            if (e.key === 'ArrowLeft' || e.key === 'a') moveSide = -0.13;
            if (e.key === 'ArrowRight' || e.key === 'd') moveSide = 0.13;
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowUp','w','ArrowDown','s','ArrowLeft','a','ArrowRight','d'].includes(e.key)) {
                moveForward = 0;
                moveSide = 0;
            }
        });

        // Animation loop
        function animate() {
            const pos = camera.getAttribute('position');
            const rot = camera.getAttribute('rotation');

            const forwardX = -Math.sin(rot.y * Math.PI / 180) * moveForward;
            const forwardZ = -Math.cos(rot.y * Math.PI / 180) * moveForward;

            camera.setAttribute('position', {
                x: pos.x + forwardX,
                y: pos.y,
                z: pos.z + forwardZ + moveSide * Math.sin(rot.y * Math.PI / 180 + Math.PI/2) * 0.8
            });

            // Robot walking animation
            const pinkRobot = document.getElementById('robot-pink');
            const blueRobot = document.getElementById('robot-blue');
            if (pinkRobot) pinkRobot.setAttribute('position', {x: -6 + Math.sin(Date.now()/800)*3, y: 1.5, z: 48});
            if (blueRobot) blueRobot.setAttribute('position', {x: 8 + Math.sin(Date.now()/600)*4, y: 1.5, z: 75});

            requestAnimationFrame(animate);
        }
        animate();

    </script>
